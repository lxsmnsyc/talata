name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test tooling (vitest 5, tsdown) needs Node 22 or newer.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter benchmark corpus
      - run: npx oxlint
      - run: npx oxfmt --check
      - run: npx tsc --noEmit -p .
        working-directory: packages/talata
      - run: pnpm --filter talata build
      - run: pnpm --filter talata test

  # `engines` says node >=20, but the tooling cannot run there. Build on a
  # supported Node, then load the built package on Node 20.
  smoke-node20:
    name: Smoke test built package (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter talata build
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - run: node .github/scripts/smoke.mjs
